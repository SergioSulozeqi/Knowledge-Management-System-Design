<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAM KM-CRM-LMS | Mastering Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stam: {
                            darkest: '#0f172a', // Slate 900
                            dark: '#1e293b',   // Slate 800
                            primary: '#0284c7', // Sky 600
                            accent: '#0ea5e9', // Sky 500
                            eco: '#10b981',    // Emerald 500
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #0284c7; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        
        /* Animazione scansione tech */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .animate-scan {
            animation: scanline 3s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-hidden selection:bg-stam-primary selection:text-white">

<div id="app" class="h-full flex relative w-full overflow-hidden">

    <!-- LOGIN (Tech & Engineering Theme) -->
    <div v-if="!isLoggedIn" class="absolute inset-0 z-50 w-full h-full flex items-center justify-center bg-slate-900 overflow-hidden p-4">
        <!-- Background innovazione/ingegneria -->
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=3000&auto=format&fit=crop')] bg-cover bg-center opacity-20 mix-blend-luminosity"></div>
        <div class="absolute -top-40 -left-40 w-[300px] h-[300px] md:w-[500px] md:h-[500px] bg-sky-600 rounded-full mix-blend-screen filter blur-[120px] opacity-30"></div>
        <div class="absolute -bottom-40 -right-40 w-[300px] h-[300px] md:w-[500px] md:h-[500px] bg-emerald-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
        
        <div class="glass-panel p-6 md:p-10 rounded-3xl shadow-2xl w-full max-w-[420px] flex flex-col items-center z-10 text-slate-800 relative">
            <div class="w-20 h-20 md:w-24 md:h-24 bg-white rounded-2xl flex items-center justify-center shadow-lg mb-4 md:mb-6 text-2xl border border-slate-200 text-stam-primary overflow-hidden">
                <!-- Sostituito il satellite con un'icona di ingegneria generica/robotica -->
                <i class="fa-solid fa-microchip text-4xl md:text-5xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-1 text-slate-900">STAM</h1>
            <p class="text-xs md:text-sm text-slate-500 mb-6 md:mb-8 font-semibold tracking-widest uppercase text-center">Mastering Excellence</p>
            
            <div class="w-full space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" placeholder="ID Knowledge Worker" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/80 border border-slate-300 focus:outline-none focus:border-stam-primary focus:ring-1 focus:ring-stam-primary text-slate-800 placeholder-slate-400 text-sm md:text-base font-medium" v-model="loginUser">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="password" placeholder="Password di Rete" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/80 border border-slate-300 focus:outline-none focus:border-stam-primary focus:ring-1 focus:ring-stam-primary text-slate-800 placeholder-slate-400 text-sm md:text-base font-medium" value="password">
                </div>
                <button @click="login" class="w-full bg-stam-primary hover:bg-sky-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg mt-4 flex items-center justify-center gap-2 group text-sm md:text-base">
                    ACCEDI ALLA PIATTAFORMA <i class="fa-solid fa-arrow-right-to-bracket group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>
            
            <div class="mt-8 flex items-center gap-2 text-xs font-semibold text-slate-500">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div> KM-CRM-LMS Unificato
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <template v-else>
        <!-- Overlay Mobile Sidebar -->
        <div v-if="isMobileMenuOpen" @click="isMobileMenuOpen = false" class="md:hidden fixed inset-0 bg-slate-900/60 z-30 backdrop-blur-sm"></div>

        <!-- SIDEBAR -->
        <aside :class="['w-64 bg-stam-darkest text-slate-300 flex flex-col shadow-xl border-r border-slate-800 transition-transform duration-300 absolute md:relative z-40 h-full', isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']">
            <div class="p-4 md:p-5 flex items-center justify-between border-b border-slate-800 bg-slate-900 cursor-pointer" @click="navigate('home')">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-stam-primary text-xl shadow-md">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-white tracking-widest text-xl leading-none">STAM</h2>
                        <p class="text-[9px] text-sky-400 font-bold tracking-wider mt-1 uppercase">Knowledge Base</p>
                    </div>
                </div>
                <button @click="isMobileMenuOpen = false" class="md:hidden text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <nav class="flex-1 px-3 py-6 space-y-1.5 overflow-y-auto">
                <button v-for="item in menuItems" :key="item.id" @click="navigate(item.id)" 
                    :class="['w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left font-medium text-sm', currentRoute === item.id ? 'bg-sky-900/50 text-sky-400 border border-sky-800' : 'hover:bg-slate-800 hover:text-white border border-transparent']">
                    <i :class="item.icon + ' w-5 text-center text-lg'"></i>
                    <span>{{ item.label }}</span>
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800 bg-slate-900">
                <div @click="navigate('profilo')" class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800 cursor-pointer transition-all mb-2 border border-transparent hover:border-slate-700">
                    <img src="https://ui-avatars.com/api/?name=Paolo+Ingegnere&background=0284c7&color=fff" alt="User" class="w-9 h-9 rounded-full shadow-md">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-sm font-bold text-white truncate">Paolo (Ingegnere)</p>
                        <p class="text-[10px] text-slate-400 truncate uppercase font-bold tracking-wider">Automazione & R&D</p>
                    </div>
                </div>
                <button @click="logout" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-xs font-bold text-red-400 hover:bg-red-900/30 rounded-lg transition-all border border-transparent hover:border-red-900/50">
                    <i class="fa-solid fa-power-off"></i> DISCONNETTI
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 h-full flex flex-col bg-slate-50 relative z-10 overflow-hidden w-full">
            <!-- HEADER -->
            <header class="bg-white border-b border-slate-200 px-4 md:px-8 py-3 md:py-4 flex flex-col sm:flex-row justify-between items-center shrink-0 shadow-sm gap-3">
                <div class="flex items-center gap-3 md:gap-4 w-full sm:w-auto justify-between sm:justify-start">
                    <div class="flex items-center gap-3">
                        <button @click="isMobileMenuOpen = true" class="md:hidden text-slate-600 text-xl"><i class="fa-solid fa-bars"></i></button>
                        <h1 class="text-lg md:text-2xl font-bold text-slate-800 flex items-center gap-2 md:gap-3 truncate">
                            <i :class="currentMenuInfo.icon + ' text-stam-primary'"></i>
                            <span class="truncate">{{ getHeaderTitle() }}</span>
                        </h1>
                    </div>
                </div>
                <div class="flex items-center gap-4 w-full sm:w-auto">
                    <div class="hidden lg:block text-xs text-right text-slate-500 mr-2">
                        Data Sistema:<br><span class="text-slate-800 font-bold">29 Agosto 2026</span>
                    </div>
                    <div class="bg-slate-100 px-3 md:px-4 py-2 rounded-full flex items-center gap-2 text-sm border border-slate-200 w-full sm:w-56 md:w-64 focus-within:ring-2 focus-within:ring-stam-primary focus-within:bg-white transition-all">
                        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                        <input type="text" placeholder="Cerca (Knowledge Graph)..." class="outline-none bg-transparent w-full text-slate-700 font-medium">
                    </div>
                </div>
            </header>

            <!-- SCROLLABLE CONTENT (Pagine del sito) -->
            <div class="flex-1 overflow-y-auto p-4 md:p-8 relative">

                <!-- 1. HOME / CHATBOT RAG -->
                <div v-if="currentRoute === 'home'" class="flex flex-col h-full max-w-5xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                    <div class="bg-slate-800 text-white p-4 flex items-center justify-between border-b border-slate-700">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 md:w-10 md:h-10 bg-stam-primary rounded-lg flex items-center justify-center shadow-md">
                                <i class="fa-solid fa-robot text-lg md:text-xl"></i>
                            </div>
                            <div>
                                <h3 class="font-bold tracking-wide text-sm md:text-base">STAM AI Assistant</h3>
                                <p class="text-[10px] md:text-xs text-emerald-400 flex items-center gap-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-circle-dot animate-pulse"></i> Motore RAG Operativo</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-slate-50/50">
                        <div v-for="(msg, index) in chatMessages" :key="index" :class="['flex w-full', msg.isBot ? 'justify-start' : 'justify-end']">
                            <div :class="['max-w-[90%] md:max-w-[85%] rounded-2xl p-4 md:p-5 shadow-sm text-sm leading-relaxed border', msg.isBot ? 'bg-white border-slate-200 rounded-tl-none text-slate-700' : 'bg-stam-primary text-white border-sky-600 rounded-tr-none']">
                                <div v-html="msg.text" class="whitespace-pre-line font-medium"></div>
                                
                                <div v-if="msg.sources" class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                                    <span class="text-xs text-slate-400 block w-full mb-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-link text-slate-300"></i> Fonti dal Knowledge Graph:</span>
                                    <span v-for="source in msg.sources" class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded border border-slate-200 flex items-center gap-2 cursor-pointer hover:bg-sky-50 hover:text-stam-primary transition-colors font-semibold" @click="triggerSimulatedAction(source)">
                                        <i :class="source.icon"></i> {{ source.name }}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-3 md:p-4 bg-white border-t border-slate-200">
                        <div class="flex gap-2 md:gap-4 overflow-x-auto pb-3 scrollbar-hide">
                            <button @click="fillChat('Trova i documenti per la cella robotica collaborativa.')" class="whitespace-nowrap text-[10px] md:text-xs bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100 px-3 md:px-4 py-2 rounded-full font-bold transition-colors">Cella Robotica Collaborativa</button>
                            <button @click="fillChat('Chi ha lavorato al progetto Idrogeno Verde (Green-H2)?')" class="whitespace-nowrap text-[10px] md:text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 px-3 md:px-4 py-2 rounded-full font-bold transition-colors">Esperti Idrogeno Verde</button>
                        </div>
                        <div class="flex gap-2 relative mt-1">
                            <input type="text" v-model="chatInput" @keyup.enter="sendMessage" placeholder="Chiedi informazioni su progetti, bandi o esperti STAM..." class="flex-1 px-4 py-3 md:py-4 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-stam-primary bg-white shadow-inner text-sm md:text-base font-medium">
                            <button @click="sendMessage" class="bg-stam-primary hover:bg-sky-700 text-white px-5 md:px-8 rounded-xl transition-all shadow-md">
                                <i class="fa-solid fa-paper-plane text-base md:text-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 2. RICERCA SPECIFICA -->
                <div v-if="currentRoute === 'ricerca'" class="bg-white rounded-2xl shadow-lg border border-slate-200 p-4 md:p-6 h-[calc(100vh-140px)] md:h-[calc(100vh-180px)] flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-slate-200 pb-4 md:pb-0 md:pr-4 overflow-y-auto max-h-48 md:max-h-full">
                        <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2 uppercase tracking-wide text-xs md:text-sm"><i class="fa-solid fa-sitemap text-stam-primary"></i> Tassonomia Aziendale</h3>
                        <ul class="space-y-1 text-sm font-semibold text-slate-600">
                            <li>
                                <div class="flex items-center gap-2 p-2 hover:bg-slate-100 rounded-lg cursor-pointer transition-colors">
                                    <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i> <i class="fa-solid fa-folder text-amber-500"></i> Energy & Environment
                                </div>
                            </li>
                            <li>
                                <div class="flex items-center gap-2 p-2 bg-sky-50 text-sky-700 rounded-lg cursor-pointer">
                                    <i class="fa-solid fa-chevron-down text-sky-500 text-xs"></i> <i class="fa-solid fa-folder-open text-amber-500"></i> Industry & Automation
                                </div>
                                <ul class="pl-6 mt-1 space-y-1 relative before:absolute before:left-3 before:top-0 before:bottom-0 before:w-px before:bg-slate-200">
                                    <li class="flex items-center gap-2 p-2 hover:bg-slate-100 rounded-lg cursor-pointer relative transition-colors"><i class="fa-solid fa-folder text-amber-500"></i> Meccatronica</li>
                                    <li class="flex items-center gap-2 p-2 bg-slate-100 rounded-lg cursor-pointer text-slate-800 relative font-bold shadow-sm border border-slate-200"><i class="fa-solid fa-folder-open text-amber-500"></i> Robotica Collaborativa</li>
                                </ul>
                            </li>
                            <li>
                                <div class="flex items-center gap-2 p-2 hover:bg-slate-100 rounded-lg cursor-pointer transition-colors">
                                    <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i> <i class="fa-solid fa-folder text-amber-500"></i> Security & Transport
                                </div>
                            </li>
                        </ul>
                    </div>
                    
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200">
                            <div class="text-xs md:text-sm text-slate-500 flex items-center gap-1 md:gap-2 truncate font-medium">
                                Industry & Automation <i class="fa-solid fa-angle-right text-xs"></i> <span class="text-slate-800 font-bold bg-slate-100 px-2 py-1 rounded truncate border border-slate-200">Robotica Collaborativa</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pb-4">
                            <div v-for="file in mockFiles" :key="file.id" @click="openFilePreview(file)" 
                                class="border border-slate-200 rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:shadow-lg hover:border-stam-primary cursor-pointer transition-all bg-white group relative">
                                <div v-if="file.restricted" class="absolute top-2 right-2 text-red-600 bg-red-50 text-[8px] md:text-[10px] font-bold px-1.5 py-0.5 rounded border border-red-200">RISERVATO</div>
                                <i :class="file.icon + ' text-4xl md:text-5xl group-hover:-translate-y-1 transition-transform ' + file.color"></i>
                                <div class="text-center mt-2 w-full">
                                    <p class="text-xs md:text-sm font-bold text-slate-700 truncate px-1">{{ file.name }}</p>
                                    <p class="text-[10px] md:text-xs text-slate-400 mt-1 font-medium">{{ file.date }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. PROGETTI -->
                <div v-if="currentRoute === 'progetti'" class="h-full">
                    <div v-if="!selectedProject" class="space-y-6">
                        <div v-for="category in projectCategories" :key="category.name" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-slate-50 px-4 md:px-6 py-3 border-b border-slate-200 flex items-center gap-3">
                                <span :class="`w-3 h-3 rounded-full shadow-sm ${category.colorClass}`"></span>
                                <h3 class="font-bold text-slate-700 uppercase tracking-wider text-xs md:text-sm">{{ category.name }}</h3>
                            </div>
                            <div class="divide-y divide-slate-100">
                                <div v-for="proj in category.projects" :key="proj.id" @click="openProject(proj)" 
                                    class="p-4 md:p-6 flex flex-col md:flex-row justify-between md:items-center hover:bg-sky-50 transition-colors cursor-pointer group gap-4">
                                    <div class="flex-1">
                                        <div class="flex gap-2 items-center mb-1">
                                            <h4 class="font-bold text-base md:text-lg text-slate-800 group-hover:text-stam-primary transition-colors">{{ proj.id }}</h4>
                                            <span v-for="tag in proj.tags" class="hidden sm:inline-block text-[10px] bg-slate-100 text-slate-600 border border-slate-200 px-2 py-0.5 rounded font-bold uppercase">{{ tag }}</span>
                                        </div>
                                        <p class="text-xs md:text-sm text-slate-500 font-medium max-w-3xl">{{ proj.title }} - {{ proj.desc }}</p>
                                    </div>
                                    <div class="text-left md:text-right md:ml-6 md:pl-6 md:border-l border-slate-200 shrink-0">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Valore Commessa</p>
                                        <div class="text-sm md:text-xl font-bold text-slate-800">{{ proj.budget }}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div v-else class="space-y-6">
                        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-lg border border-slate-200 relative overflow-hidden">
                            <!-- Background sfumato -->
                            <div class="absolute top-0 right-0 w-64 h-64 bg-stam-primary opacity-5 rounded-full filter blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
                            
                            <button @click="selectedProject = null" class="mb-4 md:absolute md:top-6 md:right-6 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-bold w-fit transition-colors"><i class="fa-solid fa-arrow-left"></i> Torna ai Progetti</button>
                            
                            <div class="flex gap-2 mb-3 mt-2 md:mt-0">
                                <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded border border-emerald-200"><i class="fa-solid fa-circle text-[8px] mr-1 align-middle"></i> In Esecuzione</span>
                                <span class="text-slate-500 font-bold text-sm ml-2">{{ selectedProject.id }}</span>
                            </div>
                            
                            <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">{{ selectedProject.title }}</h2>
                            <p class="text-sm md:text-base text-slate-600 max-w-3xl font-medium leading-relaxed">{{ selectedProject.desc }}</p>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mt-6 md:mt-8 pt-6 border-t border-slate-200">
                                <div>
                                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Partner CRM Associato</h4>
                                    <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-sky-50 transition-colors" @click="viewClientFromProject(selectedProject.partner)">
                                        <div class="w-10 h-10 bg-white border border-slate-200 rounded flex items-center justify-center text-stam-primary text-xl shadow-sm"><i class="fa-solid fa-industry"></i></div>
                                        <span class="font-bold text-slate-700 text-sm md:text-base">{{ selectedProject.partner }}</span>
                                    </div>
                                </div>
                                <div>
                                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Valore Economico</h4>
                                    <div class="text-xl md:text-2xl font-bold text-stam-primary">{{ selectedProject.budget }}</div>
                                </div>
                                <div>
                                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Project Manager</h4>
                                    <div class="flex items-center gap-3">
                                        <img src="https://ui-avatars.com/api/?name=Chiara+Scandura&background=0284c7&color=fff" class="w-10 h-10 rounded-full shadow-sm">
                                        <span class="font-bold text-slate-700">Ing. Chiara Scandura</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. BANDI -->
                <div v-if="currentRoute === 'bandi'" class="flex flex-col h-full">
                    <div v-if="!selectedBando" class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 w-full">
                        <div v-for="bando in mockBandi" :key="bando.id" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6 flex flex-col cursor-pointer hover:shadow-lg hover:border-stam-primary transition-all relative group" @click="selectedBando = bando">
                            <div class="absolute top-0 right-0 bg-amber-50 text-amber-700 text-[10px] md:text-xs font-bold px-2 md:px-3 py-1 rounded-bl-xl border-b border-l border-amber-200">
                                <i class="fa-regular fa-clock"></i> Scadenza: {{ bando.deadline }}
                            </div>
                            <div class="text-[10px] font-bold text-stam-primary uppercase tracking-widest mt-2 md:mt-0 mb-1">{{ bando.agency }}</div>
                            <h3 class="text-base md:text-lg font-bold text-slate-900 mb-2 group-hover:text-stam-primary transition-colors leading-tight">{{ bando.id }}</h3>
                            <p class="text-xs md:text-sm text-slate-500 mb-4 font-medium flex-1">{{ bando.desc }}</p>

                { id: 'crm', label: 'Intelligent CRM', icon: 'fa-solid fa-handshake' },
                { id: 'lms', label: 'Training (LMS)', icon: 'fa-solid fa-chalkboard-user' }
            ];

            const getHeaderTitle = () => {
                if (currentRoute.value === 'profilo') return 'Profilo Personale (Skill Graph)';
                if (selectedProject.value) return 'Dettaglio Progetto R&D';
                if (selectedBando.value) return 'Analisi Bando (AI)';
                return menuItems.find(m => m.id === currentRoute.value)?.label || 'Piattaforma STAM';
            };

            const currentMenuInfo = computed(() => {
                if (currentRoute.value === 'profilo') return { icon: 'fa-solid fa-id-badge' };
                return menuItems.find(m => m.id === currentRoute.value) || menuItems[0];
            });

            // Sub-views state
            const selectedProject = ref(null);
            const selectedBando = ref(null);
            const selectedClient = ref(null);

            const openProject = (proj) => selectedProject.value = proj;
            const viewClientFromProject = (clientName) => {
                const client = mockClients.find(c => c.name === clientName);
                if(client) {
                    selectedClient.value = client;
                    navigate('crm');
                }
            };

            // Modals
            const modals = reactive({ filePreview: null, videoOpen: null });
            const openFilePreview = (file) => modals.filePreview = file;
            const openVideo = (title) => modals.videoOpen = title;

            // DATI MOCK STAM (Ingegneria, Robotica, Energia, Sostenibilità)
            const mockFiles = [
                { id: 1, name: 'Spec_Cella_Robotica_v2.pdf', date: '28 Ago 2026', icon: 'fa-regular fa-file-pdf', color: 'text-red-500', restricted: true },
                { id: 2, name: 'LCA_Analisi_Idrogeno.xlsx', date: '25 Ago 2026', icon: 'fa-regular fa-file-excel', color: 'text-emerald-600', restricted: false },
                { id: 3, name: 'Layout_Impianto_Biomasse.docx', date: '10 Ago 2026', icon: 'fa-regular fa-file-word', color: 'text-sky-600', restricted: false },
                { id: 4, name: 'Report_Resilienza_Infrastrutture.pdf', date: '05 Ago 2026', icon: 'fa-regular fa-file-pdf', color: 'text-red-500', restricted: true }
            ];

            const projectCategories = [
                {
                    name: 'Progetti Innovativi In Esecuzione', colorClass: 'bg-emerald-500',
                    projects: [
                        { id: 'GREEN-H2-VALLEY', title: 'Ottimizzazione Impianti Idrogeno Verde', desc: 'Ingegnerizzazione e analisi LCA per la produzione di idrogeno da fonti rinnovabili.', budget: '1.500.000 €', tags: ['Energia', 'Sostenibilità'], partner: 'EcoEnergy S.p.A.' },
                        { id: 'SMART-COBOT-4.0', title: 'Integrazione Robotica Collaborativa', desc: 'Design e testing di celle meccatroniche avanzate per la manifattura sicura.', budget: '850.000 €', tags: ['Automazione', 'Meccatronica'], partner: 'RoboTech Industries' }
                    ]
                },
                {
                    name: 'Proposte in Stesura (Bandi EU)', colorClass: 'bg-amber-500',
                    projects: [
                        { id: 'AGRICORE-AI', title: 'Data Analytics per l\'Agricoltura', desc: 'Sviluppo di tool semantici e dashboard geo-referenziate per dataset agricoli.', budget: 'Da definire', tags: ['ICT', 'Data Science'], partner: 'AgriCore Consortium' }
                    ]
                }
            ];

            const mockBandi = [
                { id: 'HORIZON-CL4-CIRCULAR', agency: 'Horizon Europe', deadline: '15/10/2026', desc: 'Soluzioni deep-tech per la manifattura a zero sprechi e l\'economia circolare.', fullDesc: 'La call richiede competenze di systems engineering e design for sustainability per ridurre gli scarti industriali.', aiMatch: '<strong>Partner ideale (CRM):</strong> RoboTech Industries per l\'hardware. <strong>STAM:</strong> Coordinamento e Systems Engineering (Match: 88%).' },
                { id: 'EDF-2026-CYBERRES', agency: 'European Defence Fund', deadline: '02/09/2026', desc: 'Resilienza e Cyber-sicurezza per infrastrutture critiche nei trasporti marittimi.', fullDesc: 'Sviluppo di digital twins per simulazioni avanzate di attacchi alle infrastrutture.', aiMatch: '<strong>Competenza interna:</strong> Rilevata esperienza nei progetti di "Security & Transport". Mancanza di partner IT puro.' }
            ];

            const mockClients = [
                { id: 1, name: 'EcoEnergy S.p.A.', type: 'Utility & Rinnovabili', icon: 'fa-solid fa-leaf', piva: 'IT0987654321', ateco: 'Produzione di energia elettrica (35.11)', employees: 1250, contact: 'Dott. Marco Verdi', role: 'Innovation Manager', email: 'm.verdi@ecoenergy.it', logs: [{title:'Kick-off Green H2', action:'Assegnata analisi termodinamica a STAM.'}] },
                { id: 2, name: 'RoboTech Industries', type: 'Manifattura Avanzata / PMI', icon: 'fa-solid fa-robot', piva: 'IT1122334455', ateco: 'Fabbricazione di macchine (28.9)', employees: 120, contact: 'Ing. L. Ferrari', role: 'Direttore Tecnico', email: 'l.ferrari@robotech.com', logs: [{title:'Review Cella Meccatronica', action:'Richiesta modifica layout braccio.'}] },
                { id: 3, name: 'AgriCore Consortium', type: 'Ente di Ricerca Europeo', icon: 'fa-solid fa-tractor', piva: 'EU5566778899', ateco: 'Ricerca Scientifica (72.1)', employees: 50, contact: 'Prof. A. Rossi', role: 'Project Coordinator', email: 'a.rossi@agricore.eu', logs: [] }
            ];

            selectedClient.value = mockClients[0];

            // Chatbot AI
            const chatInput = ref('');
            const chatMessages = ref([{ text: "Piattaforma STAM KM-CRM-LMS inizializzata.\nL'Intelligenza Artificiale ha indicizzato i repository di Ingegneria, Automazione e Sostenibilità.\nCome posso aiutarti?", isBot: true }]);
            const fillChat = (text) => chatInput.value = text;
            
            const triggerSimulatedAction = (source) => {
                if(source.action === 'goto_project') { openProject(projectCategories[0].projects[1]); currentRoute.value = 'progetti'; }
                if(source.action === 'goto_crm') { selectedClient.value = mockClients[0]; currentRoute.value = 'crm'; }
            };

            const sendMessage = () => {
                if (!chatInput.value.trim()) return;
                const query = chatInput.value;
                chatMessages.value.push({ text: query, isBot: false });
                chatInput.value = '';

                setTimeout(() => {
                    let botReply = { text: "Ricerca semantica completata. Nessun documento esatto trovato per questa query nel dominio aziendale.", isBot: true };
                    
                    if (query.toLowerCase().includes('robot') || query.toLowerCase().includes('cella')) {
                        botReply = {
                            text: "Ho trovato dati sul progetto **SMART-COBOT-4.0**.\nLa cella robotica collaborativa è sviluppata per il partner **RoboTech Industries**.\nEcco il documento con le specifiche aggiornate:",
                            isBot: true,
                            sources: [
                                { name: 'Dettaglio Progetto SMART-COBOT', icon: 'fa-solid fa-gears text-sky-600', action: 'goto_project' },
                                { name: 'Spec_Cella_Robotica_v2.pdf', icon: 'fa-solid fa-file-pdf text-red-500' }
                            ]
                        };
                    } else if (query.toLowerCase().includes('idrogeno') || query.toLowerCase().includes('espert')) {
                        botReply = {
                            text: "Interrogazione dello Skill Graph aziendale...\n\nPer il progetto **Idrogeno Verde (GREEN-H2)** e le analisi Life Cycle Assessment (LCA), le competenze primarie sono allocate al partner **EcoEnergy S.p.A.**.\n\nInternamente, *Paolo Ingegnere* e *Chiara Scandura* hanno lavorato alla stesura dei requisiti termodinamici.",
                            isBot: true,
                            sources: [
                                { name: 'Scheda CRM: EcoEnergy', icon: 'fa-solid fa-building text-emerald-600', action: 'goto_crm' }
                            ]
                        };
                    }
                    chatMessages.value.push(botReply);
                }, 800);
            };

            const login = () => isLoggedIn.value = true;
            const logout = () => { isLoggedIn.value = false; currentRoute.value = 'home'; };

            return {
                isLoggedIn, loginUser, login, logout,
                currentRoute, menuItems, navigate, getHeaderTitle, currentMenuInfo,
                isMobileMenuOpen,
                chatInput, chatMessages, sendMessage, fillChat, triggerSimulatedAction,
                selectedProject, openProject, projectCategories, viewClientFromProject,
                selectedBando, mockBandi,
                selectedClient, mockClients, mockFiles,
                modals, openFilePreview, openVideo
            };
        }
    }).mount('#app');
</script>
</body>
</html>
